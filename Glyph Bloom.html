<style>
/* Layout: one-screen studio tool, canvas stage on the left, a dense control rail on the right; stacks on phones. */
:root {
  --bg: #141513;
  --stage: #0c0d0b;
  --panel: #1b1c19;
  --line: #2c2e29;
  --fg: #e9e7df;
  --muted: #8f9086;
  --accent: #dcc77e;
  --accent-ink: #1a1709;
  --font-ui: "Geist", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 13px; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100%; }
.stage { position: relative; background: var(--stage); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stage-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.brand b { color: var(--fg); font-weight: 500; }
.meta { font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.canvas-wrap { flex: 1; min-height: 0; display: grid; place-items: center; padding: 20px; }
#view { max-width: 100%; max-height: calc(100dvh - 90px); width: auto; height: auto; display: block; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.drop { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(12,13,11,.82); border: 2px dashed var(--accent); font-family: var(--font-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

.panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0; display: flex; flex-direction: column; }
.sec { border-bottom: 1px solid var(--line); padding-block: 14px 16px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.sec h2 { margin: 0; font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.row { display: grid; grid-template-columns: 104px minmax(0, 1fr) 40px; align-items: center; gap: 10px; }
.row label { color: var(--fg); opacity: .86; }
.row output { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.row.wide { grid-template-columns: 104px minmax(0, 1fr); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line); }
input[type=range]::-moz-range-track { height: 2px; background: var(--line); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; background: var(--fg); border: 0; border-radius: 50%; }
input[type=range]::-moz-range-thumb { width: 12px; height: 12px; background: var(--fg); border: 0; border-radius: 50%; }
input[type=range]:focus-visible::-webkit-slider-thumb { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type=text] { width: 100%; background: var(--stage); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; font: inherit; }
select:focus-visible, input[type=text]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=color] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
input[type=color]::-webkit-color-swatch { border: 0; border-radius: 2px; }
input[type=color]::-moz-color-swatch { border: 0; border-radius: 2px; }
.colors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.colors div { display: grid; gap: 4px; }
.colors span { font-size: 11px; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; cursor: pointer; border-radius: 4px; border: 1px solid var(--line); background: var(--stage); color: var(--fg); padding: 7px 11px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.small { padding: 3px 8px; font-size: 11px; font-family: var(--font-mono); letter-spacing: .04em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; font-size: 12px; }
.chip[aria-pressed="true"] { border-color: var(--fg); background: #2a2b27; }
.chip[aria-pressed="false"] { opacity: .5; }
.chip i { font-style: normal; font-family: var(--font-mono); color: var(--accent); }
.palettes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.pal { padding: 0; overflow: hidden; display: grid; grid-template-rows: 22px auto; text-align: left; }
.pal .sw { display: flex; }
.pal .sw span { flex: 1; }
.pal em { font-style: normal; font-size: 11px; padding: 4px 7px; color: var(--muted); }
.pal[aria-pressed="true"] { border-color: var(--fg); }
.pal[aria-pressed="true"] em { color: var(--fg); }
.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.toggle input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
.hint { color: var(--muted); font-size: 11.5px; line-height: 1.45; margin: 0; }
.export { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); margin-top: auto; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px; }
.toast { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 4px; font-size: 12px; }
.modal { position: fixed; inset: 0; background: rgba(8,9,7,.9); display: grid; place-items: center; padding: 24px; z-index: 20; }
.modal-card { display: grid; gap: 12px; justify-items: center; max-width: 100%; max-height: 100%; }
.modal img { max-width: min(90vw, 900px); max-height: 75vh; display: block; }
.modal p { margin: 0; color: var(--muted); text-align: center; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; height: auto; }
  html, body { height: auto; }
  .stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
  .canvas-wrap { height: 46vh; padding: 12px; }
  #view { max-height: calc(46vh - 24px); }
  .panel { border-left: 0; overflow: visible; }
  .stage-top { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<div class="app">
  <section class="stage" id="stage">
    <div class="stage-top">
      <div class="brand"><b>Glyph Bloom</b> · wzór dopasowany do zdjęcia</div>
      <div class="meta" id="meta">—</div>
    </div>
    <div class="canvas-wrap"><canvas id="view" aria-label="Podgląd kompozycji"></canvas></div>
    <div class="drop" id="drop" hidden>Upuść zdjęcie</div>

</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="modal" id="modal" hidden>

    <button id="modalClose">Zamknij</button>
  </div>
</div>

<script>
// ---------- palettes ----------
const PALETTES = {
  mech:   { name: 'Mech',   shadow: '#18240f', mid: '#5c8436', high: '#ecd67c', glow: '#f3d65a', pattern: '#ffffff', hud: '#ffffff', marker: '#c8604c' },
  noc:    { name: 'Noc',    shadow: '#060a18', mid: '#1f3c78', high: '#a6dcff', glow: '#4aa9ff', pattern: '#eef8ff', hud: '#cfe8ff', marker: '#ff6b5a' },
  roz:    { name: 'Róż',    shadow: '#240b18', mid: '#a8456f', high: '#ffd3e1', glow: '#ff8db6', pattern: '#ffffff', hud: '#ffe6ef', marker: '#ffd35a' },
  popiol: { name: 'Popiół', shadow: '#0d0d0c', mid: '#64645e', high: '#e6e3da', glow: '#ffffff', pattern: '#ffffff', hud: '#ffffff', marker: '#d24b3a' },
  zar:    { name: 'Żar',    shadow: '#170704', mid: '#a3341a', high: '#ffc66e', glow: '#ff7a2a', pattern: '#fff3de', hud: '#fff3de', marker: '#7fd0c4' },
  papier: { name: 'Papier', shadow: '#8c8672', mid: '#cfc8b1', high: '#f6f2e6', glow: '#ffffff', pattern: '#1c1b17', hud: '#1c1b17', marker: '#c8442e' },
};

// ---------- state ----------
const S = {
  format: 'source', zoom: 1, ox: 0, oy: 0,
  mode: 'auto', thr: 0.42, soft: 0.12, smooth: 1, invert: false, maskView: false,
  cell: 9, weight: 0.17, cut: 0.1, chaos: 0.25, merge: 0.5, bloom: 0.35,
  g_dot: true, g_v: true, g_h: true, g_plus: true, g_run: true,
  pattern: '#ffffff', opacity: 0.95, seed: 1061,
  bgMode: 'photo', palette: 'mech', shadow: '#18240f', mid: '#5c8436', high: '#ecd67c',
  orig: 0.12, bgContrast: 1.1, blur: 40, glow: 0.6, glowSize: 9, glowColor: '#f3d65a', grain: 0.22, vignette: 0.35,
  hud: true, hudColor: '#ffffff', marker: true, markerColor: '#c8604c',
  caption: 'You only have to begin', capFont: 'serif', capSize: 34, capColor: '#f3efe2',
  exportSize: 2160,
};

let SRC = null;      // canvas or image
let srcName = 'przykład';

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function smoothstep(a, b, x) { if (b <= a) return x >= a ? 1 : 0; const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

function blur1(a, w, h, r, passes = 2) {
  r = Math.round(r); if (r < 1) return a;
  const t = new Float32Array(a.length), d = 2 * r + 1;
  for (let p = 0; p < passes; p++) {
    for (let y = 0; y < h; y++) {
      const o = y * w; let s = 0;
      for (let x = -r; x <= r; x++) s += a[o + clamp(x, 0, w - 1)];
      for (let x = 0; x < w; x++) { t[o + x] = s / d; s += a[o + Math.min(x + r + 1, w - 1)] - a[o + Math.max(x - r, 0)]; }
    }
    for (let x = 0; x < w; x++) {
      let s = 0;
      for (let y = -r; y <= r; y++) s += t[clamp(y, 0, h - 1) * w + x];
      for (let y = 0; y < h; y++) { a[y * w + x] = s / d; s += t[Math.min(y + r + 1, h - 1) * w + x] - t[Math.max(y - r, 0) * w + x]; }
    }
  }
  return a;
}
function blurImageData(img, r) {
  if (r < 1) return img;
  const { data, width: w, height: h } = img, n = w * h;
  for (let c = 0; c < 3; c++) {
    const ch = new Float32Array(n);
    for (let i = 0; i < n; i++) ch[i] = data[i * 4 + c];
    blur1(ch, w, h, r, 3);
    for (let i = 0; i < n; i++) data[i * 4 + c] = ch[i];
  }
  return img;
}
function downscale(src, tw, th) {
  let cur = src, w = src.width, h = src.height;
  while (w / 2 > tw && h / 2 > th) {
    w = Math.round(w / 2); h = Math.round(h / 2);
    const c = mk(w, h); const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, w, h); cur = c;
  }
  const out = mk(tw, th); const x = out.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(cur, 0, 0, out.width, out.height);
  return out;
}
function percentile(arr, p) {
  if (!arr.length) return 0;
  const s = Float32Array.from(arr).sort();
  return s[Math.floor(clamp(p, 0, 1) * (s.length - 1))];
}

// ---------- sample image ----------
function makeSample() {
  const W = 1200, H = 1500, c = mk(W, H), x = c.getContext('2d'), r = mulberry32(7);
  let g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#3e5b2b'); g.addColorStop(.55, '#22301a'); g.addColorStop(1, '#556227');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const blob = (cx, cy, rad, col) => { const rg = x.createRadialGradient(cx, cy, 0, cx, cy, rad); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = rg; x.fillRect(0, 0, W, H); };
  blob(140, 720, 420, 'rgba(236,224,96,.55)');
  blob(1150, 180, 380, 'rgba(110,170,80,.45)');
  blob(620, 1300, 420, 'rgba(200,170,80,.35)');

  // stem
  const sg = x.createLinearGradient(0, 900, 0, H);
  sg.addColorStop(0, 'rgba(230,214,160,.9)'); sg.addColorStop(1, 'rgba(200,180,110,.5)');
  x.strokeStyle = sg; x.lineCap = 'round'; x.lineWidth = 46;
  x.beginPath(); x.moveTo(560, 900); x.bezierCurveTo(570, 1100, 545, 1300, 560, 1560); x.stroke();

  // blossom on its own layer
  const b = mk(W, H), bx = b.getContext('2d');
  const lobes = [[430, 520, 250], [720, 470, 220], [300, 740, 210], [560, 720, 260], [870, 720, 230], [500, 330, 170], [790, 330, 140], [190, 600, 150], [1000, 600, 150], [700, 880, 150], [380, 900, 130]];
  for (const [cx, cy, rad] of lobes) {
    const rg = bx.createRadialGradient(cx - rad * .25, cy - rad * .3, rad * .1, cx, cy, rad);
    rg.addColorStop(0, '#f8f0d8'); rg.addColorStop(.75, '#d8cba0'); rg.addColorStop(.92, 'rgba(190,175,120,.9)'); rg.addColorStop(1, 'rgba(190,175,120,0)');
    bx.fillStyle = rg; bx.beginPath(); bx.arc(cx, cy, rad, 0, Math.PI * 2); bx.fill();
  }
  // drips under the blossom
  bx.fillStyle = '#e2d6ac';
  for (const [dx, dy, dw, dh] of [[610, 920, 34, 150], [760, 960, 40, 120], [470, 980, 22, 60]]) bx.fillRect(dx, dy, dw, dh);
  bx.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 2600; i++) {
    const px = 120 + r() * 960, py = 160 + r() * 900, s = 6 + r() * 34;
    const light = r() > .45;
    bx.fillStyle = light ? `rgba(255,250,232,${.12 + r() * .25})` : `rgba(110,100,60,${.08 + r() * .22})`;
    bx.beginPath(); bx.ellipse(px, py, s, s * (.25 + r() * .4), r() * Math.PI, 0, Math.PI * 2); bx.fill();
  }
  for (const [cx, cy, rad, a] of [[650, 500, 90, .6], [520, 640, 70, .45], [420, 860, 80, .4], [820, 820, 60, .35], [300, 560, 50, .3]]) {
    const rg = bx.createRadialGradient(cx, cy, 0, cx, cy, rad);
    rg.addColorStop(0, `rgba(40,42,20,${a})`); rg.addColorStop(1, 'rgba(40,42,20,0)');
    bx.fillStyle = rg; bx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
  }
  const under = bx.createLinearGradient(0, 650, 0, 1000);
  under.addColorStop(0, 'rgba(80,70,30,0)'); under.addColorStop(1, 'rgba(80,70,30,.5)');
  bx.fillStyle = under; bx.fillRect(0, 650, W, 400);
  x.drawImage(b, 0, 0);
  return c;
}

// ---------- render ----------
function outSize(long) {
  const iw = SRC.width, ih = SRC.height;
  let ar = iw / ih;
  if (S.format !== 'source') { const [a, b] = S.format.split(':').map(Number); ar = a / b; }
  return ar >= 1 ? [long, Math.round(long / ar)] : [Math.round(long * ar), long];
}

function render(target, long) {
  const [W, H] = outSize(long);
  target.width = W; target.height = H;
  const ctx = target.getContext('2d');
  const k = Math.max(W, H) / 1200;
  const rng = mulberry32(S.seed);

  // base: source covered into output frame
  const base = mk(W, H), bctx = base.getContext('2d');
  const iw = SRC.width, ih = SRC.height;
  const sc = Math.max(W / iw, H / ih) * S.zoom, dw = iw * sc, dh = ih * sc;
  bctx.fillStyle = '#000'; bctx.fillRect(0, 0, W, H);
  bctx.imageSmoothingQuality = 'high';
  bctx.drawImage(SRC, (W - dw) / 2 + S.ox * W / 2, (H - dh) / 2 + S.oy * H / 2, dw, dh);

  // ---- analysis grid ----
  const c = S.cell * k, cols = Math.ceil(W / c), rows = Math.ceil(H / c), n = cols * rows;
  const grid = downscale(base, cols, rows).getContext('2d').getImageData(0, 0, cols, rows).data;
  const L = new Float32Array(n), M = new Float32Array(n);
  let br = 0, bg = 0, bb = 0, bn = 0;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (x > 1 && y > 1 && x < cols - 2 && y < rows - 2) continue;
    const i = (y * cols + x) * 4; br += grid[i]; bg += grid[i + 1]; bb += grid[i + 2]; bn++;
  }
  br /= bn * 255; bg /= bn * 255; bb /= bn * 255;
  const bL = .2126 * br + .7152 * bg + .0722 * bb;
  for (let i = 0; i < n; i++) {
    const R = grid[i * 4] / 255, G = grid[i * 4 + 1] / 255, B = grid[i * 4 + 2] / 255;
    const l = .2126 * R + .7152 * G + .0722 * B; L[i] = l;
    let m;
    if (S.mode === 'auto') m = Math.hypot(R - br, G - bg, B - bb) + Math.abs(l - bL) * .6;
    else if (S.mode === 'bright') m = l;
    else if (S.mode === 'dark') m = 1 - l;
    else { const mx = Math.max(R, G, B), mn = Math.min(R, G, B); m = mx ? (mx - mn) / mx : 0; }
    M[i] = m;
  }
  const lo = percentile(M, .02), hi = percentile(M, .98) || 1;
  for (let i = 0; i < n; i++) { let v = clamp((M[i] - lo) / Math.max(1e-4, hi - lo), 0, 1); M[i] = S.invert ? 1 - v : v; }
  blur1(M, cols, rows, S.smooth, 2);

  // which cells are inside
  const inside = new Uint8Array(n);
  const a0 = S.thr - S.soft / 2, a1 = S.thr + S.soft / 2;
  let minX = cols, minY = rows, maxX = -1, maxY = -1, sx = 0, sy = 0, cnt = 0;
  const insideL = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const i = y * cols + x, p = smoothstep(a0, a1, M[i]);
    if (p > 0 && rng() < p) {
      inside[i] = 1; insideL.push(L[i]);
      if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
      sx += x; sy += y; cnt++;
    }
  }
  const tLo = percentile(insideL, .03), tHi = percentile(insideL, .97);
  const tone = (i) => clamp((L[i] - tLo) / Math.max(1e-4, tHi - tLo), 0, 1);
  const bbox = cnt ? { x0: minX * c, y0: minY * c, x1: (maxX + 1) * c, y1: (maxY + 1) * c, cx: (sx / cnt + .5) * c, cy: (sy / cnt + .5) * c } : { x0: W * .3, y0: H * .3, x1: W * .7, y1: H * .7, cx: W / 2, cy: H / 2 };

  $('meta').textContent = `${srcName} · ${W}×${H} · siatka ${cols}×${rows} · ${cnt} znaków`;

  if (S.maskView) {

    const long = Math.max(img.naturalWidth, img.naturalHeight), f = Math.min(1, 2400 / long);
    const c = mk(img.naturalWidth * f, img.naturalHeight * f); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    SRC = c; srcName = file.name.replace(/\.[^.]+$/, '').slice(0, 28) || 'zdjęcie';
    URL.revokeObjectURL(url); schedule();
  };
  img.onerror = () => toast('Nie udało się odczytać tego zdjęcia.');
  img.src = url;
}
$('file').addEventListener('change', e => { loadFile(e.target.files[0]); e.target.value = ''; });
const stage = $('stage');
let dragDepth = 0;
stage.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('drop').hidden = false; });
stage.addEventListener('dragover', e => e.preventDefault());
stage.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
stage.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('drop').hidden = true; loadFile(e.dataTransfer.files[0]); });
window.addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/')); if (f) loadFile(f); });

let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

// ---------- export ----------
let downloads = null;
if (window.claude?.use) claude.use('downloads').then(d => downloads = d).catch(() => {});
async function exportPNG() {
  const btn = $('exportBtn'); btn.disabled = true; btn.textContent = 'Renderuję…';
  await new Promise(r => setTimeout(r, 30));
  const out = mk(1, 1); render(out, S.exportSize);
  const blob = await new Promise(r => out.toBlob(r, 'image/png'));
  btn.disabled = false; btn.textContent = 'Pobierz PNG';
  const name = `glyph-bloom-${srcName}-${out.width}x${out.height}.png`.replace(/[^\w.\-ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]+/g, '-');
  if (downloads) {
    try { await downloads.save({ filename: name, data: blob }); toast('Zapisano ' + name); return; }
    catch (err) { if (err?.code === 'declined') return; }
  }
  $('modalImg').src = URL.createObjectURL(blob); $('modal').hidden = false;
}
$('modalClose').onclick = () => { $('modal').hidden = true; };

// ---------- boot ----------
buildUI();
SRC = makeSample();
schedule();
document.fonts?.ready.then(schedule);
</script>
